[package]
name = "ocilot"
version = "0.2.2"
edition = "2024"
description = "cli and library for interacting with OCI registries"
license = "MIT OR Apache-2.0"

[dependencies]
astral-tokio-tar = "0.7"
async-compression = {
  version = "0.4",
  features = [
    "bzip2",
    "gzip",
    "lzma",
    "tokio",
    "xz",
    "zstd",
  ],
  optional = true
}
async-recursion = "1.1"
async-trait = "0.1"
aws-config = {
  version = "1",
  default-features = false,
  features = [
    "default-https-client",
    "credentials-process",
    "rt-tokio",
  ],
  optional = true
}
aws-sdk-ecr = {
  version = "1",
  default-features = false,
  features = [
    "default-https-client",
    "rt-tokio",
  ],
  optional = true
}
aws-sdk-ecrpublic = {
  version = "1",
  default-features = false,
  features = [
    "default-https-client",
    "rt-tokio",
  ],
  optional = true
}
base16 = "0.2"
base64 = "0.23"
bon = "3"
bytes = "1.12"
cfg-if = "1.0"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
home = "0.5"
indicatif = { version = "0.18", optional = true }
jiff = { version = "0.2", features = ["serde"] }
keyring = "4.2"
reqwest = {
  version = "0.13",
  features = [
    "json",
    "stream",
  ]
}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
snafu = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-indicatif = { version = "0.3", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[features]
default = ["aws", "compression", "progress"]
aws = [
  "dep:aws-config",
  "dep:aws-sdk-ecr",
  "dep:aws-sdk-ecrpublic",
]
compression = ["dep:async-compression"]
progress = ["dep:indicatif", "dep:tracing-indicatif"]
